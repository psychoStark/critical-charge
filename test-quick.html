<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Critical Charge - Quick Test</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>

  <!-- SCREEN: shown permanently if Battery API is unavailable -->
  <div id="screen-unsupported">
    <div class="unsupported-box">
      <p class="unsupported-title">⚡ HARDWARE UNSUPPORTED</p>
      <p class="unsupported-body">
        This device does not support the Battery Status API.<br/>
        Critical Charge requires a Chromium-based browser<br/>
        on Android, Windows, or macOS.
      </p>
      <p class="unsupported-small">Running in Test-Quick mode. Battery API check bypassed.</p>
    </div>
  </div>

  <!-- THE GAME CANVAS — fixed internal resolution, CSS scales it -->
  <canvas id="game"></canvas>

  <script type="module" src="/test-quick.js"></script>
</body>
</html>
