<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Critical Charge — Test</title>
  <link rel="stylesheet" href="./src/style.css" />
  <style>
    /* Base reset to fill the viewport */
    body {
      margin: 0;
      padding: 0;
      background-color: #0b0014;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* Force the canvas to scale down and fit the window perfectly */
    #game {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      box-shadow: 0 0 20px rgba(124, 58, 237, 0.15);
    }
  </style>
</head>
<body>

  <canvas id="game"></canvas>

  <div id="debug-tilt" style="display: none;"></div>
  <div id="debug-touch" style="display: none;"></div>

  <script>
    // Enable debug overlays only for test harness
    window.__SHOW_DEBUG = true;
    window.__TEST_MODE = true;
  </script>
  <script type="module" src="./test.js"></script>
</body>
</html>
