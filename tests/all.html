<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Critical Charge — All Tests</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #07070f; font-family: 'Courier New', monospace; color: #ccc; padding: 1.5rem; min-height: 100vh; }
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
    .page-title { font-size: 1rem; color: #f0c040; letter-spacing: .06em; }
    .page-sub { font-size: .7rem; color: #444; margin-top: .2rem; }
    .back { font-size: .75rem; color: #333; text-decoration: none; padding: .3rem .75rem; border: 1px solid #1a1a2e; border-radius: 4px; }
    .back:hover { color: #f0c040; border-color: #f0c040; }
    .panel { background: #0d0d1f; border: 1px solid #1a1a2e; border-radius: 6px; overflow: hidden; margin-bottom: 1rem; }
    .panel-head { padding: .6rem 1rem; border-bottom: 1px solid #111; font-size: .7rem; color: #444; letter-spacing: .08em; text-transform: uppercase; }
    .panel-body { padding: 1rem; }
    .ctrl { margin-bottom: .85rem; }
    .ctrl label { font-size: .75rem; color: #666; display: block; margin-bottom: .25rem; }
    .ctrl input[type=range] { width: 100%; accent-color: #f0c040; height: 4px; margin-top: .25rem; }
    .val-display { font-size: .8rem; color: #f0c040; font-weight: bold; float: right; margin-top: -.25rem; }
    .toggle-row { display: flex; align-items: center; gap: .5rem; font-size: .75rem; color: #555; margin-bottom: .75rem; }
    input[type=checkbox] { accent-color: #EF9F27; }
    .stat-box { background: #07070f; border: 1px solid #111; border-radius: 4px; padding: .6rem .75rem; margin-bottom: .5rem; }
    .stat-label { font-size: .65rem; color: #444; text-transform: uppercase; letter-spacing: .06em; }
    .stat-value { font-size: 1.1rem; color: #f0c040; font-weight: bold; margin-top: .1rem; font-family: monospace; }
    .test-game-btn { width: 100%; padding: .8rem; font-size: .9rem; font-weight: bold; letter-spacing: .05em; border: 2px solid #f0c040; background: #f0c040; color: #000; cursor: pointer; border-radius: 6px; margin-top: 1rem; transition: background .15s, transform .1s; }
    .test-game-btn:hover { background: #ffd060; transform: translateY(-1px); }
    .test-game-btn:active { transform: translateY(0); }
    .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media(max-width:900px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="page-header">
    <div>
      <div class="page-title">⚡ ALL TEST CONTROLS</div>
      <div class="page-sub">Tweak every game parameter and test run the game</div>
    </div>
    <a class="back" href="/tests/">← harness</a>
  </div>

  <div class="layout">
    <!-- LEFT COLUMN -->
    <div style="display:flex;flex-direction:column;gap:0">
      <!-- Battery Simulation -->
      <div class="panel">
        <div class="panel-head">🔋 Battery Simulation</div>
        <div class="panel-body">
          <div class="ctrl">
            <label>Simulated level <span class="val-display" id="val-battery-level">50%</span></label>
            <input type="range" id="ctrl-battery-level" min="0" max="100" value="50" />
          </div>
          <div class="toggle-row">
            <input type="checkbox" id="ctrl-battery-charging" />
            <label for="ctrl-battery-charging" style="display:inline;margin:0;color:#EF9F27;cursor:pointer">Charging</label>
          </div>
          <div class="stat-box">
            <div class="stat-label">Simulated speed</div>
            <div class="stat-value" id="val-battery-speed">—</div>
          </div>
        </div>
      </div>

      <!-- Velocity Curve -->
      <div class="panel">
        <div class="panel-head">📈 Velocity Curve</div>
        <div class="panel-body">
          <div class="ctrl">
            <label>Min speed (100% batt) <span class="val-display" id="val-min-speed">1.0×</span></label>
            <input type="range" id="ctrl-min-speed" min="0.5" max="5" step="0.1" value="1.0" />
          </div>
          <div class="ctrl">
            <label>Max speed (0% batt) <span class="val-display" id="val-max-speed">8.0×</span></label>
            <input type="range" id="ctrl-max-speed" min="2" max="20" step="0.5" value="8.0" />
          </div>
          <div class="ctrl">
            <label>Curve exponent <span class="val-display" id="val-speed-exp">1.0</span></label>
            <input type="range" id="ctrl-speed-exp" min="0.5" max="3" step="0.1" value="1.0" />
          </div>
        </div>
      </div>

      <!-- Renderer Controls -->
      <div class="panel">
        <div class="panel-head">🎮 Renderer Controls</div>
        <div class="panel-body">
          <div class="ctrl">
            <label>Scroll speed <span class="val-display" id="val-scroll-speed">3.0</span></label>
            <input type="range" id="ctrl-scroll-speed" min="0" max="12" step="0.5" value="3" />
          </div>
          <div class="ctrl">
            <label>Camera X offset <span class="val-display" id="val-camera-x">0</span></label>
            <input type="range" id="ctrl-camera-x" min="-200" max="200" value="0" />
          </div>
          <div class="ctrl">
            <label>Horizon Y <span class="val-display" id="val-horizon-y">140</span></label>
            <input type="range" id="ctrl-horizon-y" min="60" max="280" value="140" />
          </div>
          <div class="ctrl">
            <label>Track half-width <span class="val-display" id="val-track-half">200</span></label>
            <input type="range" id="ctrl-track-half" min="80" max="400" value="200" />
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT COLUMN -->
    <div style="display:flex;flex-direction:column;gap:0">
      <!-- Gameplay Controls -->
      <div class="panel">
        <div class="panel-head">🕹️ Gameplay Controls</div>
        <div class="panel-body">
          <div class="ctrl">
            <label>Jump force <span class="val-display" id="val-jump-force">800</span></label>
            <input type="range" id="ctrl-jump-force" min="400" max="1200" value="800" />
          </div>
          <div class="ctrl">
            <label>Gravity <span class="val-display" id="val-gravity">-2500</span></label>
            <input type="range" id="ctrl-gravity" min="-4000" max="-1000" value="-2500" />
          </div>
          <div class="ctrl">
            <label>Obstacle spawn rate <span class="val-display" id="val-spawn-rate">1.5</span></label>
            <input type="range" id="ctrl-spawn-rate" min="0.5" max="5" step="0.1" value="1.5" />
          </div>
        </div>
      </div>

      <!-- Input Controls -->
      <div class="panel">
        <div class="panel-head">🎯 Input Controls</div>
        <div class="panel-body">
          <div class="ctrl">
            <label>Swipe threshold (px) <span class="val-display" id="val-swipe-threshold">50</span></label>
            <input type="range" id="ctrl-swipe-threshold" min="10" max="100" step="5" value="50" />
          </div>
          <div class="ctrl">
            <label>Tilt sensitivity <span class="val-display" id="val-tilt-sensitivity">0.030</span></label>
            <input type="range" id="ctrl-tilt-sensitivity" min="0.005" max="0.1" step="0.005" value="0.03" />
          </div>
          <div class="ctrl">
            <label>Tilt deadzone <span class="val-display" id="val-deadzone">0.05</span></label>
            <input type="range" id="ctrl-deadzone" min="0" max="0.3" step="0.01" value="0.05" />
          </div>
        </div>
      </div>

      <!-- Test Game Button -->
      <div class="panel">
        <div class="panel-head">▶ Test Run</div>
        <div class="panel-body" style="text-align:center;">
          <p style="font-size:.75rem;color:#555;margin-bottom:.75rem;">Launch the game with all the above values applied</p>
          <button class="test-game-btn" id="run-all-test">▶ TEST GAME</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { getBatterySpeed, setBatteryConfig, MIN_SPEED, MAX_SPEED, SPEED_EXPONENT } from '/src/core/battery.js';

    // ── Wire up all sliders to their display values ──────────────────────────────
    const sliders = [
      { ctrl: 'ctrl-battery-level',  val: 'val-battery-level',  suffix: '%',   parse: v => parseInt(v) },
      { ctrl: 'ctrl-min-speed',      val: 'val-min-speed',      suffix: '×',  parse: v => parseFloat(v).toFixed(1) },
      { ctrl: 'ctrl-max-speed',      val: 'val-max-speed',      suffix: '×',  parse: v => parseFloat(v).toFixed(1) },
      { ctrl: 'ctrl-speed-exp',      val: 'val-speed-exp',      suffix: '',   parse: v => parseFloat(v).toFixed(1) },
      { ctrl: 'ctrl-scroll-speed',   val: 'val-scroll-speed',   suffix: '',   parse: v => parseFloat(v).toFixed(1) },
      { ctrl: 'ctrl-camera-x',       val: 'val-camera-x',       suffix: '',   parse: v => parseInt(v) },
      { ctrl: 'ctrl-horizon-y',      val: 'val-horizon-y',      suffix: '',   parse: v => parseInt(v) },
      { ctrl: 'ctrl-track-half',     val: 'val-track-half',     suffix: '',   parse: v => parseInt(v) },
      { ctrl: 'ctrl-jump-force',     val: 'val-jump-force',     suffix: '',   parse: v => parseInt(v) },
      { ctrl: 'ctrl-gravity',        val: 'val-gravity',        suffix: '',   parse: v => parseInt(v) },
      { ctrl: 'ctrl-spawn-rate',     val: 'val-spawn-rate',     suffix: '',   parse: v => parseFloat(v).toFixed(1) },
      { ctrl: 'ctrl-swipe-threshold',val: 'val-swipe-threshold',suffix: '',   parse: v => parseInt(v) },
      { ctrl: 'ctrl-tilt-sensitivity',val:'val-tilt-sensitivity',suffix: '',   parse: v => parseFloat(v).toFixed(3) },
      { ctrl: 'ctrl-deadzone',       val: 'val-deadzone',       suffix: '',   parse: v => parseFloat(v).toFixed(2) },
    ];

    sliders.forEach(s => {
      const ctrlEl = document.getElementById(s.ctrl);
      const valEl = document.getElementById(s.val);
      if (!ctrlEl || !valEl) {
        console.warn(`Element not found: ${s.ctrl} or ${s.val}`);
        return;
      }
      ctrlEl.addEventListener('input', () => {
        valEl.textContent = s.parse(ctrlEl.value) + s.suffix;
        // Update battery speed display when battery or velocity params change
        if (s.ctrl.startsWith('ctrl-battery-') || s.ctrl.startsWith('ctrl-min-') || s.ctrl.startsWith('ctrl-max-') || s.ctrl.startsWith('ctrl-speed-')) {
          updateSpeedDisplay();
        }
      });
    });

    function updateSpeedDisplay() {
      const levelEl = document.getElementById('ctrl-battery-level');
      const minSpeedEl = document.getElementById('ctrl-min-speed');
      const maxSpeedEl = document.getElementById('ctrl-max-speed');
      const expEl = document.getElementById('ctrl-speed-exp');
      const speedEl = document.getElementById('val-battery-speed');
      
      if (!levelEl || !minSpeedEl || !maxSpeedEl || !expEl || !speedEl) {
        console.warn('Required elements not found for speed display');
        return;
      }
      
      const level = parseInt(levelEl.value) / 100;
      // Temporarily apply battery config to get accurate speed reading
      setBatteryConfig({
        minSpeed: parseFloat(minSpeedEl.value),
        maxSpeed: parseFloat(maxSpeedEl.value),
        exp: parseFloat(expEl.value)
      });
      speedEl.textContent = getBatterySpeed(level).toFixed(2) + '×';
    }

    // Initialize speed display
    updateSpeedDisplay();

    // ── Run test game ────────────────────────────────────────────────────────────
    const runTestBtn = document.getElementById('run-all-test');
    if (runTestBtn) {
      runTestBtn.addEventListener('click', () => {
        const config = {
          // Battery
          batteryLevel: parseInt(document.getElementById('ctrl-battery-level').value) / 100,
          batteryCharging: document.getElementById('ctrl-battery-charging').checked,
          // Velocity
          minSpeed: parseFloat(document.getElementById('ctrl-min-speed').value),
          maxSpeed: parseFloat(document.getElementById('ctrl-max-speed').value),
          exp: parseFloat(document.getElementById('ctrl-speed-exp').value),
          // Renderer
          scrollSpeed: parseFloat(document.getElementById('ctrl-scroll-speed').value),
          cameraX: parseFloat(document.getElementById('ctrl-camera-x').value),
          horizonY: parseFloat(document.getElementById('ctrl-horizon-y').value),
          trackHalf: parseFloat(document.getElementById('ctrl-track-half').value),
          // Gameplay
          jumpForce: parseFloat(document.getElementById('ctrl-jump-force').value),
          gravity: parseFloat(document.getElementById('ctrl-gravity').value),
          spawnRate: parseFloat(document.getElementById('ctrl-spawn-rate').value),
          // Input
          swipeThreshold: parseFloat(document.getElementById('ctrl-swipe-threshold').value),
          tiltSensitivity: parseFloat(document.getElementById('ctrl-tilt-sensitivity').value),
          deadzone: parseFloat(document.getElementById('ctrl-deadzone').value),
        };
        sessionStorage.setItem('testConfig', JSON.stringify(config));
        window.location.href = '/tests/test-game.html';
      });
    } else {
      console.error('Run test button not found');
    }
  </script>
</body>
</html>
