<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Test: Input System</title>
</head>
<body>
<script type="module">
import { injectShell, renderDiff } from '/tests/test-runner.js'
injectShell('Input System Test', 'src/core/input.js')

// ── Constants — mirror input.js ───────────────────────────────────────────────
const DEFAULTS = { TILT_SENSITIVITY: 0.03, SWIPE_THRESHOLD: 30, DEADZONE: 0.05 }
let p = { ...DEFAULTS }
let codeOpen = false

// ── Shared inputState object (mirrors the real input.js export) ───────────────
const inputState = { targetLane: 0, tiltX: 0, rawTilt: 0, lastSwipeDir: null }

document.body.insertAdjacentHTML('beforeend', `
<div class="layout">
  <div style="display:flex;flex-direction:column;gap:12px">

    <!-- Visual lane indicator -->
    <div class="panel">
      <div class="panel-head">Lane Position Visualiser</div>
      <div class="panel-body" style="padding:1.25rem .75rem">
        <canvas id="laneCanvas" width="580" height="100" style="width:100%;border-radius:4px;image-rendering:pixelated;display:block"></canvas>
        <div style="display:flex;justify-content:space-between;font-size:.65rem;color:#333;margin-top:.3rem;padding:0 .25rem">
          <span>← Left lane</span><span>Center</span><span>Right lane →</span>
        </div>
      </div>
    </div>

    <!-- inputState live readout -->
    <div class="panel">
      <div class="panel-head">inputState (live)</div>
      <div class="panel-body">
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <div class="stat-box" style="flex:1">
            <div class="stat-label">targetLane</div>
            <div class="stat-value" id="laneStat">0</div>
            <div class="stat-sub">-1 = left, 0 = center, 1 = right</div>
          </div>
          <div class="stat-box" style="flex:1">
            <div class="stat-label">tiltX</div>
            <div class="stat-value" id="tiltStat">0.00</div>
            <div class="stat-sub">-1.0 to 1.0</div>
          </div>
          <div class="stat-box" style="flex:1">
            <div class="stat-label">rawTilt γ</div>
            <div class="stat-value" id="rawTiltStat">0°</div>
            <div class="stat-sub">device gamma</div>
          </div>
          <div class="stat-box" style="flex:1">
            <div class="stat-label">Last swipe</div>
            <div class="stat-value" id="swipeStat">—</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Event log -->
    <div class="panel">
      <div class="panel-head">Event Log</div>
      <div class="panel-body">
        <div id="eventLog" style="font-size:.7rem;color:#555;line-height:2;max-height:140px;overflow-y:auto;font-family:monospace">
          <div>Try keyboard arrows, touch swipe, or device tilt...</div>
        </div>
      </div>
    </div>

    <!-- Tilt simulator -->
    <div class="panel">
      <div class="panel-head">Tilt Simulator <span style="font-size:.65rem;color:#EF9F27">(for non-mobile)</span></div>
      <div class="panel-body">
        <div class="ctrl">
          <label>Simulated tilt (gamma) <span class="val-display" id="simTiltDisplay">0°</span></label>
          <input type="range" min="-45" max="45" value="0" oninput="simulateTilt(+this.value)"/>
        </div>
        <button onclick="document.querySelector('[oninput*=simTiltDisplay]').value=0;simulateTilt(0)"
          style="font-size:.7rem;padding:.3rem .75rem;border:1px solid #333;background:transparent;color:#666;cursor:pointer;border-radius:4px;font-family:monospace">
          Reset tilt
        </button>
      </div>
    </div>

  </div>

  <!-- Right: constants tuner -->
  <div style="display:flex;flex-direction:column;gap:12px">
    <div class="panel">
      <div class="panel-head">Input Constants</div>
      <div class="panel-body">
        <div class="ctrl">
          <label>Tilt sensitivity <span class="val-display" id="tiltSensDisplay">${DEFAULTS.TILT_SENSITIVITY}</span></label>
          <input type="range" min="0.005" max="0.1" step="0.005" value="${DEFAULTS.TILT_SENSITIVITY}" oninput="onConst('TILT_SENSITIVITY',+this.value,'tiltSensDisplay','')"/>
        </div>
        <div class="ctrl">
          <label>Swipe threshold (px) <span class="val-display" id="swipeDisplay">${DEFAULTS.SWIPE_THRESHOLD}</span></label>
          <input type="range" min="10" max="100" step="5" value="${DEFAULTS.SWIPE_THRESHOLD}" oninput="onConst('SWIPE_THRESHOLD',+this.value,'swipeDisplay','px')"/>
        </div>
        <div class="ctrl">
          <label>Tilt deadzone <span class="val-display" id="deadzoneDisplay">${DEFAULTS.DEADZONE}</span></label>
          <input type="range" min="0" max="0.3" step="0.01" value="${DEFAULTS.DEADZONE}" oninput="onConst('DEADZONE',+this.value,'deadzoneDisplay','')"/>
        </div>

        <div style="background:#07070f;border:1px solid #111;border-radius:4px;padding:.6rem .75rem;margin-bottom:.5rem">
          <div style="font-size:.65rem;color:#444;margin-bottom:.3rem">KEYBOARD TEST</div>
          <div style="font-size:.75rem;color:#555;line-height:1.8">
            Press <span style="color:#f0c040;border:1px solid #333;padding:0 5px;border-radius:3px">←</span>
            <span style="color:#f0c040;border:1px solid #333;padding:0 5px;border-radius:3px">→</span> to change lane<br/>
            Press <span style="color:#f0c040;border:1px solid #333;padding:0 5px;border-radius:3px">A</span>
            <span style="color:#f0c040;border:1px solid #333;padding:0 5px;border-radius:3px">D</span> also works
          </div>
        </div>

        <div style="background:#07070f;border:1px solid #111;border-radius:4px;padding:.6rem .75rem;margin-bottom:.75rem">
          <div style="font-size:.65rem;color:#444;margin-bottom:.3rem">TOUCH TEST</div>
          <div id="touchZone" style="height:60px;border:1px dashed #222;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:#333;cursor:pointer;touch-action:none;user-select:none">
            Swipe here →
          </div>
        </div>

        <button class="show-code-btn" id="showCodeBtn" onclick="toggleCode()">Show code changes</button>
        <button onclick="storeAndLaunchTestGame()">Test Game with Current Settings</button>
      </div>
    </div>
  </div>
</div>

<div class="code-panel" id="codePanel">
  <div class="code-panel-head">Files to update <button onclick="navigator.clipboard.writeText(document.getElementById('diffContent').innerText)" style="font-size:.65rem;padding:2px 8px;border:1px solid #222;background:transparent;color:#555;cursor:pointer;font-family:monospace">Copy all</button></div>
  <div id="diffContent"></div>
</div>
`)

// ── Lane canvas ───────────────────────────────────────────────────────────────
const lc   = document.getElementById('laneCanvas')
const lctx = lc.getContext('2d')
let lerpedLane = 0

function drawLane() {
  const W = lc.width, H = lc.height
  lctx.fillStyle = '#07070f'; lctx.fillRect(0,0,W,H)
  // Lane zones
  const lanes = [-1,0,1]
  lanes.forEach(l => {
    const cx = W/2 + l*(W/3)
    lctx.strokeStyle = '#1a1a2e'; lctx.lineWidth=1
    lctx.beginPath(); lctx.moveTo(cx - W/6, 0); lctx.lineTo(cx - W/6, H); lctx.stroke()
    lctx.beginPath(); lctx.moveTo(cx + W/6, 0); lctx.lineTo(cx + W/6, H); lctx.stroke()
    lctx.fillStyle = l === inputState.targetLane ? '#f0c04022' : '#0d0d1f'
    lctx.fillRect(cx - W/6 + 1, 0, W/3 - 2, H)
    lctx.fillStyle = '#333'; lctx.font='11px monospace'; lctx.textAlign='center'
    lctx.fillText(l === -1 ? 'LEFT' : l === 0 ? 'CENTER' : 'RIGHT', cx, H - 8)
  })
  // Player dot
  lerpedLane += (inputState.targetLane - lerpedLane) * 0.12
  const px = W/2 + lerpedLane*(W/3)
  const tiltPx = inputState.tiltX * 40
  lctx.fillStyle = '#f0c040'
  lctx.beginPath(); lctx.arc(px + tiltPx, H/2 - 8, 12, 0, Math.PI*2); lctx.fill()
  // Tilt indicator
  if (Math.abs(inputState.tiltX) > p.DEADZONE) {
    lctx.fillStyle = '#E24B4A'
    lctx.fillRect(px + tiltPx - 2, H/2 + 8, 4, 10)
  }
  requestAnimationFrame(drawLane)
}
drawLane()

// ── Input handlers (state-only — mirrors input.js) ────────────────────────────
function log(type, detail) {
  const el = document.getElementById('eventLog')
  const t  = new Date().toLocaleTimeString()
  el.insertAdjacentHTML('afterbegin', `<div><span style="color:#333">${t}</span>  <span style="color:#7F77DD">${type}</span>  ${detail}</div>`)
  updateStats()
}
function updateStats() {
  document.getElementById('laneStat').textContent  = inputState.targetLane
  document.getElementById('tiltStat').textContent  = inputState.tiltX.toFixed(3)
  document.getElementById('rawTiltStat').textContent = inputState.rawTilt.toFixed(1) + '°'
  document.getElementById('swipeStat').textContent = inputState.lastSwipeDir || '—'
}

// Keyboard
window.addEventListener('keydown', e => {
  let moved = false
  if (e.key === 'ArrowLeft'  || e.key === 'a') { inputState.targetLane = Math.max(-1, inputState.targetLane - 1); moved = true }
  if (e.key === 'ArrowRight' || e.key === 'd') { inputState.targetLane = Math.min(1,  inputState.targetLane + 1); moved = true }
  if (moved) log('keydown', `→ lane ${inputState.targetLane}`)
})

// Touch swipe
let touchStartX = 0, touchStartY = 0
const tz = document.getElementById('touchZone')
tz.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; e.preventDefault() }, {passive:false})
tz.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX
  const dy = e.changedTouches[0].clientY - touchStartY
  if (Math.abs(dx) > p.SWIPE_THRESHOLD && Math.abs(dx) > Math.abs(dy)) {
    const dir = dx > 0 ? 1 : -1
    inputState.targetLane = Math.max(-1, Math.min(1, inputState.targetLane + dir))
    inputState.lastSwipeDir = dx > 0 ? 'right' : 'left'
    log('swipe', `${inputState.lastSwipeDir}  Δx=${Math.round(dx)}px  → lane ${inputState.targetLane}`)
  }
})
// Mouse swipe fallback for desktop testing
let mouseDown = false
tz.addEventListener('mousedown', e => { touchStartX = e.clientX; mouseDown = true })
tz.addEventListener('mouseup', e => {
  if (!mouseDown) return; mouseDown = false
  const dx = e.clientX - touchStartX
  if (Math.abs(dx) > p.SWIPE_THRESHOLD) {
    const dir = dx > 0 ? 1 : -1
    inputState.targetLane = Math.max(-1, Math.min(1, inputState.targetLane + dir))
    inputState.lastSwipeDir = dx > 0 ? 'right' : 'left'
    log('swipe (mouse)', `${inputState.lastSwipeDir}  Δx=${Math.round(dx)}px → lane ${inputState.targetLane}`)
  }
})

// Device tilt
window.addEventListener('deviceorientation', e => {
  const gamma = e.gamma || 0
  inputState.rawTilt = gamma
  const normalised = Math.max(-1, Math.min(1, gamma / 45))
  inputState.tiltX = Math.abs(normalised) < p.DEADZONE ? 0 : normalised * p.TILT_SENSITIVITY * 60
  updateStats()
})

window.simulateTilt = function(deg) {
  document.getElementById('simTiltDisplay').textContent = deg + '°'
  inputState.rawTilt = deg
  const normalised = Math.max(-1, Math.min(1, deg / 45))
  inputState.tiltX = Math.abs(normalised) < p.DEADZONE ? 0 : normalised
  log('tilt (sim)', `γ=${deg}°  →  tiltX=${inputState.tiltX.toFixed(3)}`)
}
window.onConst = function(key, val, dispId, suffix) {
  p[key] = val
  document.getElementById(dispId).textContent = parseFloat(val).toFixed(val < 1 ? 3 : 0) + suffix
  if (codeOpen) buildDiffContent()
}

// ── Code diff ──────────────────────────────────────────────────────────────────
window.toggleCode = function() {
  codeOpen = !codeOpen
  document.getElementById('codePanel').classList.toggle('open', codeOpen)
  document.getElementById('showCodeBtn').classList.toggle('open', codeOpen)
  document.getElementById('showCodeBtn').textContent = codeOpen ? 'Hide code changes' : 'Show code changes'
  if (codeOpen) buildDiffContent()
}
function buildDiffContent() {
  const files = [{
    path: 'src/core/input.js',
    note: 'Update these constants at the top of input.js.',
    lines: [
      { type:'comment', text:'// ── Input constants ──────────────────────────────' },
      ...Object.keys(DEFAULTS).map(k => {
        const changed = p[k] !== DEFAULTS[k]
        return changed
          ? [{ type:'remove', text:`const ${k} = ${DEFAULTS[k]}` }, { type:'add', text:`const ${k} = ${p[k]}` }]
          : [{ type:'ctx',    text:`const ${k} = ${p[k]}` }]
      }).flat()
    ]
  }]
  renderDiff(document.getElementById('diffContent'), files)
}

updateStats()
    
    // Store test settings and launch test game
    window.storeAndLaunchTestGame = () => {
      // Store input constants
      sessionStorage.setItem('testTiltSensitivity', p.TILT_SENSITIVITY);
      sessionStorage.setItem('testSwipeThreshold', p.SWIPE_THRESHOLD);
      sessionStorage.setItem('testDeadzone', p.DEADZONE);
      window.location.href = '/tests/test-game.html';
    }
  </script>
</body>
</html>
