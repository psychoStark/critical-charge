<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Test: Battery</title>
  <style>
    body { background: #0a0a1a; font-family: monospace; color: #ccc; padding: 2rem; }
    h2   { color: #f0c040; margin-bottom: 1rem; }
    .row { margin: .75rem 0; font-size: .9rem; }
    .val { color: #1D9E75; font-weight: bold; }
    .fail{ color: #E24B4A; }
    input[type=range] { width: 300px; }
    button { margin-top: 1rem; padding: .4rem 1rem; background: #1a1a2e; color: #f0c040; border: 1px solid #f0c040; cursor: pointer; font-family: monospace; }
    a { color: #555; font-size: .8rem; display: block; margin-top: 2rem; }
  </style>
</head>
<body>
  <h2>⚡ Battery API Test</h2>

  <div class="row">API available: <span class="val" id="api-status">checking...</span></div>
  <div class="row">Real level:     <span class="val" id="real-level">—</span></div>
  <div class="row">Charging:       <span class="val" id="charging">—</span></div>
  <div class="row">Speed (real):   <span class="val" id="real-speed">—</span></div>

  <hr style="border-color:#222;margin:1.5rem 0"/>

  <div class="row">Simulate level: <input type="range" id="sim-level" min="0" max="100" value="50" /> <span id="sim-val">50%</span></div>
  <div class="row">Simulated speed: <span class="val" id="sim-speed">—</span></div>

  <button onclick="runBoundaryTests()">Run boundary tests</button>
  <button onclick="storeAndLaunchTestGame()" style="background: #f0c040; color: #000;">▶ Test Game with Current Settings</button>
  <pre id="test-output" style="margin-top:1rem;font-size:.8rem;line-height:1.8"></pre>

  <a href="/tests/">← back to harness</a>

  <script type="module">
    import { initBattery, getBatteryLevel, getBatterySpeed } from '/src/core/battery.js'

    const battery = await initBattery()

    if (!battery) {
      document.getElementById('api-status').textContent = 'NOT AVAILABLE'
      document.getElementById('api-status').className = 'fail'
    } else {
      document.getElementById('api-status').textContent = 'AVAILABLE ✓'
      const update = () => {
        document.getElementById('real-level').textContent = Math.round(battery.level * 100) + '%'
        document.getElementById('charging').textContent   = battery.charging ? 'yes' : 'no'
        document.getElementById('real-speed').textContent = getBatterySpeed(battery.level).toFixed(2) + 'x'
      }
      update()
      battery.addEventListener('levelchange', update)
      battery.addEventListener('chargingchange', update)
    }

    // Slider simulation — tests the speed formula at any level
    const slider = document.getElementById('sim-level')
    const simSpeed = document.getElementById('sim-speed')
    const simVal   = document.getElementById('sim-val')
    slider.addEventListener('input', () => {
      const level = slider.value / 100
      simVal.textContent   = slider.value + '%'
      simSpeed.textContent = getBatterySpeed(level).toFixed(2) + 'x'
    })
    simSpeed.textContent = getBatterySpeed(0.5).toFixed(2) + 'x'

    // Boundary tests
    window.runBoundaryTests = () => {
      const out = document.getElementById('test-output')
      const cases = [
        { level: 1.0, expectedMin: 1.0, expectedMax: 1.5, label: 'Full charge (1.0)' },
        { level: 0.5, expectedMin: 3.5, expectedMax: 5.0, label: 'Half charge (0.5)' },
        { level: 0.1, expectedMin: 6.0, expectedMax: 8.0, label: 'Low battery (0.1)' },
        { level: 0.0, expectedMin: 7.5, expectedMax: 8.1, label: 'Dead battery (0.0)' },
      ]
      let results = ''
      cases.forEach(c => {
        const speed  = getBatterySpeed(c.level)
        const passed = speed >= c.expectedMin && speed <= c.expectedMax
        results += `${passed ? '✓' : '✗'} ${c.label}: speed=${speed.toFixed(2)}  (expected ${c.expectedMin}–${c.expectedMax})\n`
      })
      out.textContent = results
    }
    
    // Store test settings and launch test game
    window.storeAndLaunchTestGame = () => {
      const level = parseFloat(document.getElementById('sim-level').value) / 100;
      // Store in sessionStorage so test-game.html can retrieve it
      sessionStorage.setItem('testBatteryLevel', level);
      sessionStorage.setItem('testCharging', false); // Default for battery test
      window.location.href = '/tests/test-game.html';
    }
  </script>
</body>
</html>
