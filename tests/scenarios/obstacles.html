<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Test: Obstacle System</title>
</head>
<body>
<script type="module">
import { getBattery, injectShell, renderDiff } from '/tests/test-runner.js'
injectShell('Obstacle System Test', 'src/systems/obstacle-manager.js')

const DEFAULTS = {
  SPAWN_RATE:     1.5,   // obstacles per second at 1× speed
  Z_SPEED:        0.4,   // how fast z decreases per second (at 1× speed)
  CULL_THRESHOLD: 0.02,  // remove below this z
  LANE_SPREAD:    160,   // px, half-width of lane offset
  BASE_W:         48,
  BASE_H:         60,
  HORIZON_Y:      140,
  CAM_HEIGHT:     120,
}
let p = { ...DEFAULTS }
let codeOpen = false
let obstacles = [], spawnTimer = 0, scrollSpeed = 3, batteryLevel = 0.5
let last = 0, animId = null
const LANES = [-1, 0, 1]
const CANVAS_W = 640, CANVAS_H = 360

document.body.insertAdjacentHTML('beforeend', `
<div class="layout">
  <div style="display:flex;flex-direction:column;gap:12px">
    <div class="panel">
      <div class="panel-head">
        Canvas
        <span style="font-size:.65rem;color:#333" id="statsLabel">obstacles: 0 | culled: 0</span>
      </div>
      <div class="panel-body" style="padding:.5rem">
        <canvas id="c" width="640" height="360" style="width:100%;display:block;image-rendering:pixelated;border-radius:4px"></canvas>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head">Live Stats</div>
      <div class="panel-body">
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <div class="stat-box" style="flex:1"><div class="stat-label">Active</div><div class="stat-value" id="activeCount">0</div></div>
          <div class="stat-box" style="flex:1"><div class="stat-label">Culled total</div><div class="stat-value" id="culledCount">0</div></div>
          <div class="stat-box" style="flex:1"><div class="stat-label">Battery sim</div><div class="stat-value" id="battDisplay">50%</div></div>
          <div class="stat-box" style="flex:1"><div class="stat-label">Speed ×</div><div class="stat-value" id="speedDisplay">—</div></div>
        </div>
      </div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:12px">
    <div class="panel">
      <div class="panel-head">Battery Simulator</div>
      <div class="panel-body">
        <div class="ctrl">
          <label>Battery level <span class="val-display" id="battLvlDisplay">50%</span></label>
          <input type="range" min="0" max="100" value="50" oninput="setBattery(+this.value)"/>
        </div>
        <div style="font-size:.7rem;color:#555;line-height:1.9;padding:.4rem .5rem;background:#07070f;border-radius:4px">
          <div>Gate open: <span id="gateOpen" style="color:#f0c040">—</span></div>
          <div>Spawn rate: <span id="spawnRate" style="color:#f0c040">—</span>/s</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">Obstacle Constants</div>
      <div class="panel-body">
        <div class="ctrl">
          <label>Spawn rate (/sec) <span class="val-display" id="spawnRateDisplay">${DEFAULTS.SPAWN_RATE}</span></label>
          <input type="range" min="0.2" max="5" step="0.1" value="${DEFAULTS.SPAWN_RATE}" oninput="onConst('SPAWN_RATE',+this.value,'spawnRateDisplay','')"/>
        </div>
        <div class="ctrl">
          <label>Z speed (depth/sec) <span class="val-display" id="zSpeedDisplay">${DEFAULTS.Z_SPEED}</span></label>
          <input type="range" min="0.05" max="1.5" step="0.05" value="${DEFAULTS.Z_SPEED}" oninput="onConst('Z_SPEED',+this.value,'zSpeedDisplay','')"/>
        </div>
        <div class="ctrl">
          <label>Lane spread (px) <span class="val-display" id="laneSpreadDisplay">${DEFAULTS.LANE_SPREAD}</span></label>
          <input type="range" min="40" max="300" step="10" value="${DEFAULTS.LANE_SPREAD}" oninput="onConst('LANE_SPREAD',+this.value,'laneSpreadDisplay','px')"/>
        </div>
        <div class="ctrl">
          <label>Base width (px) <span class="val-display" id="baseWDisplay">${DEFAULTS.BASE_W}</span></label>
          <input type="range" min="16" max="120" step="4" value="${DEFAULTS.BASE_W}" oninput="onConst('BASE_W',+this.value,'baseWDisplay','px')"/>
        </div>
        <div class="ctrl">
          <label>Base height (px) <span class="val-display" id="baseHDisplay">${DEFAULTS.BASE_H}</span></label>
          <input type="range" min="16" max="160" step="4" value="${DEFAULTS.BASE_H}" oninput="onConst('BASE_H',+this.value,'baseHDisplay','px')"/>
        </div>
        <button onclick="obstacles=[]" style="font-size:.7rem;padding:.3rem .75rem;border:1px solid #333;background:transparent;color:#666;cursor:pointer;border-radius:4px;font-family:monospace;margin-bottom:.75rem">Clear obstacles</button>
        <button class="show-code-btn" id="showCodeBtn" onclick="toggleCode()">Show code changes</button>
        <button onclick="storeAndLaunchTestGame()">Test Game with Current Settings</button>
      </div>
    </div>
  </div>
</div>

<div class="code-panel" id="codePanel">
  <div class="code-panel-head">Files to update <button onclick="navigator.clipboard.writeText(document.getElementById('diffContent').innerText)" style="font-size:.65rem;padding:2px 8px;border:1px solid #222;background:transparent;color:#555;cursor:pointer;font-family:monospace">Copy all</button></div>
  <div id="diffContent"></div>
</div>
`)

const canvas = document.getElementById('c')
const ctx    = canvas.getContext('2d')
let culledCount = 0

function getBatterySpeed(level) {
  return 1.0 + (8.0 - 1.0) * (1 - level)
}
function getGateOpen(level) {
  return Math.round(25 + (80 - 25) * level)
}

window.setBattery = function(v) {
  batteryLevel = v / 100
  document.getElementById('battLvlDisplay').textContent = v + '%'
  document.getElementById('battDisplay').textContent    = v + '%'
  scrollSpeed = getBatterySpeed(batteryLevel)
  document.getElementById('speedDisplay').textContent = scrollSpeed.toFixed(2) + '×'
  document.getElementById('gateOpen').textContent = getGateOpen(batteryLevel) + '%'
  document.getElementById('spawnRate').textContent = (p.SPAWN_RATE * scrollSpeed).toFixed(2)
}
window.onConst = function(key, val, dispId, suffix) {
  p[key] = val
  document.getElementById(dispId).textContent = parseFloat(val).toFixed(val < 2 ? 2 : 0) + suffix
  if (codeOpen) buildDiffContent()
}

setBattery(50)

function spawnObstacle() {
  const lane   = LANES[Math.floor(Math.random() * LANES.length)]
  const types  = ['gate', 'barrier']
  obstacles.push({
    z:     1.0,
    laneX: lane * p.LANE_SPREAD,
    type:  types[Math.floor(Math.random()*types.length)],
    lane
  })
}

function loop(ts) {
  const dt = Math.min((ts - last) / 1000, 0.05)
  last = ts

  // Spawn
  spawnTimer += dt * scrollSpeed * p.SPAWN_RATE
  while (spawnTimer >= 1) { spawnObstacle(); spawnTimer -= 1 }

  // Update Z
  obstacles.forEach(o => o.z -= p.Z_SPEED * scrollSpeed * dt)

  // Cull
  const before = obstacles.length
  obstacles = obstacles.filter(o => o.z > p.CULL_THRESHOLD)
  culledCount += before - obstacles.length

  // Draw
  ctx.fillStyle = '#0a0a1a'
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H)

  // Sky + horizon
  ctx.fillStyle = '#f0c04011'
  ctx.fillRect(0, p.HORIZON_Y, CANVAS_W, 1)

  // Track scanlines (simplified)
  for (let y = p.HORIZON_Y; y < CANVAS_H; y += 8) {
    const scale = p.CAM_HEIGHT / Math.max(y - p.HORIZON_Y, 1)
    const hw    = 200 * scale
    const sx    = CANVAS_W/2 - hw
    const idx   = Math.floor(y / 8)
    ctx.fillStyle = idx%2===0 ? '#141428' : '#1a1a2e'
    ctx.fillRect(sx, y, hw*2, 6)
    ctx.fillStyle='#f0c040'
    ctx.fillRect(sx,y,2,6); ctx.fillRect(sx+hw*2-2,y,2,6)
  }

  // Obstacles
  const sorted = [...obstacles].sort((a,b) => b.z - a.z)
  sorted.forEach(o => {
    if (o.z <= 0 || o.z > 1) return  // horizon Z-cull

    const scale   = p.CAM_HEIGHT / (o.z * (CANVAS_H - p.HORIZON_Y))
    const screenX = (o.laneX) * scale + CANVAS_W / 2
    const screenY = p.HORIZON_Y + (CANVAS_H - p.HORIZON_Y) * (1 - o.z)
    const w = p.BASE_W  * (1/o.z) * 0.15
    const h = p.BASE_H  * (1/o.z) * 0.15

    // Color by type
    ctx.strokeStyle = o.type === 'gate' ? '#f0c040' : '#E24B4A'
    ctx.lineWidth   = Math.max(1, 2 * (1/o.z) * 0.15)
    ctx.fillStyle   = o.type === 'gate' ? '#f0c04022' : '#E24B4A22'
    ctx.fillRect(screenX - w/2, screenY - h, w, h)
    ctx.strokeRect(screenX - w/2, screenY - h, w, h)

    // Z label (debug)
    ctx.fillStyle = '#ffffff44'
    ctx.font = `${Math.max(8, 10*(1/o.z)*0.15)}px monospace`
    ctx.textAlign = 'center'
    ctx.fillText('z='+o.z.toFixed(2), screenX, screenY - h - 2)
  })

  // Stats
  document.getElementById('activeCount').textContent = obstacles.length
  document.getElementById('culledCount').textContent = culledCount
  document.getElementById('statsLabel').textContent  = `active: ${obstacles.length} | culled: ${culledCount}`

  animId = requestAnimationFrame(loop)
}
requestAnimationFrame(loop)

// ── Code diff ──────────────────────────────────────────────────────────────────
window.toggleCode = function() {
  codeOpen = !codeOpen
  document.getElementById('codePanel').classList.toggle('open', codeOpen)
  document.getElementById('showCodeBtn').classList.toggle('open', codeOpen)
  document.getElementById('showCodeBtn').textContent = codeOpen ? 'Hide code changes' : 'Show code changes'
  if (codeOpen) buildDiffContent()
}
function buildDiffContent() {
  const KEYS_TO_DIFF = ['SPAWN_RATE','Z_SPEED','LANE_SPREAD','BASE_W','BASE_H']
  const files = [{
    path: 'src/systems/obstacle-manager.js',
    note: 'Update these constants at the top of obstacle-manager.js.',
    lines: [
      { type:'comment', text:'// ── Obstacle constants ───────────────────────────' },
      ...KEYS_TO_DIFF.map(k => {
        const changed = p[k] !== DEFAULTS[k]
        return changed
          ? [{ type:'remove', text:`const ${k} = ${DEFAULTS[k]}` }, { type:'add', text:`const ${k} = ${p[k]}` }]
          : [{ type:'ctx',    text:`const ${k} = ${p[k]}` }]
      }).flat()
    ]
  }]
  renderDiff(document.getElementById('diffContent'), files)
}

// Store test settings and launch test game
window.storeAndLaunchTestGame = () => {
  // Store obstacle constants
  sessionStorage.setItem('testSpawnRate', p.SPAWN_RATE);
  sessionStorage.setItem('testZSpeed', p.Z_SPEED);
  sessionStorage.setItem('testLaneSpread', p.LANE_SPREAD);
  sessionStorage.setItem('testBaseW', p.BASE_W);
  sessionStorage.setItem('testBaseH', p.BASE_H);
  // Store battery level
  sessionStorage.setItem('testBatteryLevel', batteryLevel);
  window.location.href = '/tests/test-game.html';
}
</script>
</body>
</html>
